<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#2d2d30" />
      <stop offset="100%" stop-color="#121214" />
    </radialGradient>
    
    <!-- Planet/Core Gradient -->
    <linearGradient id="planetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9f43" />
      <stop offset="50%" stop-color="#ee5253" />
      <stop offset="100%" stop-color="#10ac84" />
    </linearGradient>

    <!-- Gear/Tech Ring Gradient -->
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00d2d3" />
      <stop offset="100%" stop-color="#00a8ff" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <dropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <!-- Outer Technology/Modding Ring (Gears and Tech lines) -->
  <g filter="url(#dropShadow)" transform="translate(256, 256)">
    <!-- Tech Outer Circle -->
    <circle r="180" fill="none" stroke="url(#gearGrad)" stroke-width="4" stroke-dasharray="20 10 5 10" />
    <circle r="160" fill="none" stroke="url(#gearGrad)" stroke-width="2" stroke-opacity="0.4" />

    <!-- Gear teeth representing modularity / mods -->
    <g id="gear-teeth">
      <path d="M -15 -195 L 15 -195 L 20 -175 L -20 -175 Z" fill="url(#gearGrad)" />
      <path d="M -15 -195 L 15 -195 L 20 -175 L -20 -175 Z" fill="url(#gearGrad)" transform="rotate(45)" />
      <path d="M -15 -195 L 15 -195 L 20 -175 L -20 -175 Z" fill="url(#gearGrad)" transform="rotate(90)" />
      <path d="M -15 -195 L 15 -195 L 20 -175 L -20 -175 Z" fill="url(#gearGrad)" transform="rotate(135)" />
      <path d="M -15 -195 L 15 -195 L 20 -175 L -20 -175 Z" fill="url(#gearGrad)" transform="rotate(180)" />
      <path d="M -15 -195 L 15 -195 L 20 -175 L -20 -175 Z" fill="url(#gearGrad)" transform="rotate(225)" />
      <path d="M -15 -195 L 15 -195 L 20 -175 L -20 -175 Z" fill="url(#gearGrad)" transform="rotate(270)" />
      <path d="M -15 -195 L 15 -195 L 20 -175 L -20 -175 Z" fill="url(#gearGrad)" transform="rotate(315)" />
    </g>

    <!-- Inner Core Planet (RimWorld theme) -->
    <circle r="120" fill="url(#planetGrad)" />

    <!-- Planet Shadow overlay for 3D sphere look -->
    <path d="M -120 0 A 120 120 0 0 0 120 0 A 120 70 0 0 1 -120 0 Z" fill="#000000" fill-opacity="0.25" />
    
    <!-- Planetary Ring representing RimWorld orbit -->
    <ellipse rx="190" ry="40" fill="none" stroke="#ffffff" stroke-width="12" stroke-opacity="0.8" transform="rotate(-25)" />
    <!-- Back part of ring masking (using concentric structures) -->
    <!-- (We let standard ellipse render; for perfect orbital overlay, standard design uses simple glowing lines) -->
    <ellipse rx="195" ry="45" fill="none" stroke="url(#gearGrad)" stroke-width="2" stroke-opacity="0.5" transform="rotate(-25)" />

    <!-- Futuristic Tech Overlay / 'M' for Mods and 'R' for RimWorld stylized integration -->
    <g transform="translate(0, 5)">
      <!-- Stylized Arrow pointing UP (Sorting / Bootstrapper) -->
      <path d="M -40 20 L 0 -40 L 40 20 L 20 20 L 0 -15 L -20 20 Z" fill="#ffffff" filter="url(#dropShadow)" />
      <!-- Support pillar -->
      <rect x="-8" y="20" width="16" height="30" fill="#ffffff" rx="4" />
    </g>

    <!-- Dots representing orbital stations / modules -->
    <circle cx="140" cy="-70" r="12" fill="#00d2d3" />
    <circle cx="-130" cy="80" r="8" fill="#ff9f43" />
    <circle cx="90" cy="110" r="10" fill="#ee5253" />
  </g>
</svg>
