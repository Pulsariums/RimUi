<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="pulsarGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#00f2ff" />
      <stop offset="100%" stop-color="#001a33" />
    </radialGradient>
    <linearGradient id="modGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2ff" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="256" cy="256" r="250" fill="#0a0a0f" stroke="#1a1a2e" stroke-width="2" />

  <!-- Compass Outer Ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#3c3c3c" stroke-width="4" stroke-dasharray="10,15" />
  
  <!-- Cardinal Points -->
  <line x1="256" y1="56" x2="256" y2="76" stroke="#ffffff" stroke-width="4" /> <!-- North -->
  <line x1="256" y1="436" x2="256" y2="456" stroke="#ffffff" stroke-width="4" /> <!-- South -->
  <line x1="56" y1="256" x2="76" y2="256" stroke="#ffffff" stroke-width="4" /> <!-- West -->
  <line x1="436" y1="256" x2="456" y2="256" stroke="#ffffff" stroke-width="4" /> <!-- East -->

  <!-- Pulsar Core -->
  <circle cx="256" cy="256" r="40" fill="url(#pulsarGlow)" />
  
  <!-- Pulsar Beams (Pulses) -->
  <g stroke="#00f2ff" stroke-width="8" stroke-linecap="round" opacity="0.7">
    <line x1="256" y1="216" x2="256" y2="150" />
    <line x1="256" y1="300" x2="256" y2="360" />
    <line x1="216" y1="256" x2="150" y2="256" />
    <line x1="300" y1="256" x2="360" y2="256" />
  </g>

  <!-- Sorted Mod Blocks (The Result of the Tool) -->
  <g fill="url(#modGradient)">
    <rect x="380" y="220" width="40" height="20" rx="4" />
    <rect x="380" y="245" width="40" height="20" rx="4" />
    <rect x="380" y="270" width="40" height="20" rx="4" />
    <rect x="380" y="295" width="40" height="20" rx="4" />
  </g>

  <!-- App Name -->
  <text x="256" y="480" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff">RimPlus</text>
  <text x="256" y="500" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#969696">MOD MANAGER &amp; OPTIMIZER</text>
</svg>
