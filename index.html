<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RimWorld Forge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="bg-slate-950 text-slate-100 font-sans antialiased overflow-hidden">

    <div id="app-shell" class="flex flex-col h-screen w-screen overflow-hidden">

      <!-- EN ÜST: GLOBAL PENCERE BAŞLIK ÇUBUĞU (Tüm genişlikte) -->
      <!-- data-tauri-drag-region SADECE text'in child div'inde. Butonlar KARDEŞ element -->
      <div id="ui-title-bar" class="flex h-8 bg-slate-950 border-b border-slate-900 shrink-0 select-none z-50">
        <div data-tauri-drag-region class="flex-1 flex items-center px-3 cursor-move">
          <span data-i18n="app_brand_main" class="pointer-events-none text-[9px] font-mono font-bold tracking-[0.2em] text-rust">RIMWORLD_FORGE // v1.0.4</span>
        </div>
        <div class="flex items-center space-x-1 px-3 shrink-0">
          <button id="btn-window-min" class="p-1 text-slate-600 hover:text-white hover:bg-slate-800 rounded-sm transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 12h14" /></svg>
          </button>
          <button id="btn-window-max" class="p-1 text-slate-600 hover:text-white hover:bg-slate-800 rounded-sm transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4h16v4M4 16v4h16v-4" /></svg>
          </button>
          <button id="btn-window-close" class="p-1 text-slate-600 hover:text-red-500 hover:bg-red-500 rounded-sm transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" /></svg>
          </button>
        </div>
      </div>

      <!-- İÇERİK ALANI (flex-row: preset-strip | main-container | splitter | inspector) -->
      <div id="ui-content-area" class="flex flex-1 overflow-hidden min-w-0 bg-slate-900">

        <!-- KATMAN 1: PRESET MASTER STRIP (En Sol) -->
        <aside id="ui-preset-strip" class="w-12 bg-slate-900 border-r border-slate-800 flex flex-col items-center py-4 shrink-0">
          <div id="preset-container" class="w-full flex flex-col items-center">
          </div>
          
          <!-- Preset Ekleme Butonu -->
          <div class="preset-btn-wrapper">
            <button id="btn-add-preset" data-i18n-title="preset_add_title" class="w-8 h-8 rounded-[var(--radius-industrial)] bg-slate-950 border border-dashed border-slate-700 text-xs hover:bg-slate-800 hover:border-slate-600 transition-all flex items-center justify-center text-slate-500 hover:text-slate-300" title="Yeni Preset Ekle">+</button>
          </div>
        </aside>

        <!-- ANA ÇALIŞMA ALANI (Orta) -->
        <div id="ui-main-container" class="flex flex-col flex-1 overflow-hidden min-w-0 bg-slate-900">

          <!-- KOMUT MERKEZİ -->
          <header id="ui-command-bar" class="h-14 bg-slate-900 border-b border-slate-800 shrink-0 overflow-hidden" style="display: grid; grid-template-columns: auto 1fr auto; align-items: center; padding: 0 16px; gap: 12px;">
            
            <!-- Sol: Profil Etiketi -->
            <div id="ui-command-left" class="flex items-center space-x-3 overflow-hidden shrink-0">
              <div class="w-1 h-10 bg-rust shrink-0"></div>
              <div class="flex flex-col">
                <span data-i18n="active_profile" class="text-[8px] font-mono text-slate-600 uppercase tracking-widest leading-tight">AKTIF PROFIL</span>
                <span id="active-profile-label" class="text-xs text-slate-100 font-bold tracking-wide truncate">VARSAYILAN</span>
              </div>
            </div>

            <!-- Orta: Arama -->
            <div id="ui-command-center" class="flex items-center min-w-0">
              <div class="relative w-full">
                <input type="text" id="mod-search" data-i18n="search_global" placeholder="MOD ADI VEYA ID ILE ARA..." class="w-full bg-slate-950 border border-slate-700 px-4 py-2 text-xs font-mono text-slate-200 placeholder-slate-600 focus:outline-none focus:border-rust focus:ring-1 focus:ring-rust/20 rounded-[var(--radius-industrial)] transition-all pl-10" />
                <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-600">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                </span>
              </div>
            </div>

            <!-- Sağ: Butonlar -->
            <div id="ui-command-right" class="flex items-center space-x-2 shrink-0">
              <button id="btn-undo" data-i18n-title="btn_undo" title="Geri Al (Ctrl+Z)" class="cmd-icon-btn">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 14L4 9l5-5M4 9h10a6 6 0 010 12h-3" /></svg>
              </button>
              <button id="btn-redo" data-i18n-title="btn_redo" title="Ileri Al (Ctrl+Y)" class="cmd-icon-btn">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 14l5-5-5-5M20 9H10a6 6 0 000 12h3" /></svg>
              </button>
              <div class="w-px h-6 bg-slate-700/60 mx-1 shrink-0"></div>
              <button id="btn-sort" data-i18n-title="btn_sort" title="Bagimliliga gore sirala" class="cmd-icon-btn">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 4h13M3 8h9M3 12h5m8 4l3 3m0 0l3-3m-3 3V9" /></svg>
              </button>
              <button id="btn-update" data-i18n-title="btn_update" title="Modlari guncelle" class="cmd-icon-btn">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 21h16"/></svg>
              </button>
              <button id="btn-validate" data-i18n-title="btn_validate" title="Siralamayi dogrula" class="cmd-icon-btn">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
              </button>
              <button id="btn-save-config" class="group relative px-3 py-2 bg-emerald-700 border border-emerald-600 text-[9px] font-mono hover:bg-emerald-600 hover:border-emerald-500 active:bg-emerald-500 rounded-[var(--radius-industrial)] transition-all text-emerald-200 hover:text-white flex items-center space-x-2 whitespace-nowrap">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                <span data-i18n="apply" class="tracking-wider">UYGULA</span>
              </button>
              <button id="btn-save-preset" style="display:none" class="group relative px-3 py-2 bg-amber-700 border border-amber-600 text-[9px] font-mono hover:bg-amber-600 hover:border-amber-500 active:bg-amber-500 rounded-[var(--radius-industrial)] transition-all text-amber-200 hover:text-white flex items-center space-x-2 whitespace-nowrap">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" /></svg>
                <span data-i18n="save_preset" class="tracking-wider">PRESETE KAYDET</span>
              </button>
              <button id="btn-save-apply-preset" style="display:none" class="group relative px-3 py-2 bg-rust border border-rust text-[9px] font-mono hover:bg-rust-light hover:border-rust-light active:bg-rust-light rounded-[var(--radius-industrial)] transition-all text-white hover:text-white flex items-center space-x-2 whitespace-nowrap">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0zM7 20h10" /></svg>
                <span data-i18n="save_apply_preset" class="tracking-wider">KAYDET &amp; UYGULA</span>
              </button>
              <button id="btn-open-steamcmd" class="group relative px-3 py-2 bg-slate-800 border border-slate-700 text-[9px] font-mono hover:bg-slate-700 hover:border-rust active:bg-slate-600 rounded-[var(--radius-industrial)] transition-all text-slate-300 hover:text-white flex items-center space-x-2 whitespace-nowrap">
                <span class="w-2 h-2 rounded-full bg-slate-600 group-hover:bg-emerald-500 transition-colors duration-300 shrink-0"></span>
                <span data-i18n="steamcmd_btn" class="tracking-wider">[STEAMCMD]</span>
              </button>
              <button id="btn-open-settings" class="group relative px-3 py-2 bg-slate-800 border border-slate-700 text-[9px] font-mono hover:bg-slate-700 hover:border-rust active:bg-slate-600 rounded-[var(--radius-industrial)] transition-all text-slate-300 hover:text-white flex items-center space-x-2 whitespace-nowrap">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 group-hover:rotate-90 transition-transform duration-300 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                <span data-i18n="settings_btn" class="tracking-wider">[AYAR]</span>
              </button>
              <button id="btn-launch-game" class="relative group h-9 px-5 bg-slate-700/80 hover:bg-slate-600 active:bg-slate-500 border border-slate-600/50 hover:border-slate-500/60 text-[10px] font-mono font-bold text-slate-200 hover:text-white rounded-[var(--radius-industrial)] transition-all duration-200 flex items-center space-x-2 overflow-hidden cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 relative z-10" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
                <span data-i18n="launch" class="relative z-10">BASLAT</span>
              </button>
            </div>
          </header>

          <!-- ORTA: RAF SISTEMI -->
          <div id="ui-workspace" class="flex flex-1 overflow-hidden min-w-0">
            
            <!-- Birlesik raf container -->
            <div class="flex flex-1 overflow-hidden bg-slate-900">
              
              <!-- Sol: Kutuphane -->
              <section id="ui-library-pane" style="flex-basis: 50%" class="flex flex-col min-w-0">
                <div class="shelf-header p-2 flex flex-col shrink-0 gap-1">
                  <div class="flex justify-between items-center">
                    <span data-i18n="library_header" class="text-[10px] font-mono font-bold uppercase tracking-widest text-slate-500">KUTUPHANE (PASIFLER)</span>
                    <span class="text-[10px] font-mono text-slate-600" id="library-count">0 MOD</span>
                  </div>
                  <input id="library-search" type="search" data-i18n="lib_search" placeholder="Kutuphanede ara..." class="shelf-search-input" autocomplete="off">
                  <div class="shelf-loading-bar" id="library-loading" style="display:none">
                    <div class="shelf-loading-bar-fill" id="library-loading-bar"></div>
                    <span class="shelf-loading-count" id="library-loading-count">0 / 0 MOD</span>
                  </div>
                </div>
                <div id="ui-library-shelves" class="flex-1 overflow-y-auto">
                  <div class="shelf-skeleton" id="library-skeleton">
                    <div class="app-loading-spinner"></div>
                    <span data-i18n="loading_mods" class="shelf-skeleton-text">MODLAR YÜKLENİYOR</span>
                  </div>
                </div>
              </section>

              <!-- Splitter -->
              <div id="left-right-splitter" class="w-[3px] bg-slate-700/40 hover:bg-slate-500/50 cursor-ew-resize transition-colors shrink-0 relative mx-[3px]">
                <div class="absolute inset-y-0 -left-[6px] -right-[6px] cursor-ew-resize"></div>
              </div>

              <!-- Sag: Aktif -->
              <section id="ui-active-pane" style="flex-basis: 50%" class="flex flex-col min-w-0">
                <div class="shelf-header p-2 flex flex-col shrink-0 gap-1">
                  <div class="flex justify-between items-center">
                    <span data-i18n="active_header" class="text-[10px] font-mono font-bold uppercase tracking-widest text-slate-500">AKTIF YUKLEME SIRASI</span>
                    <span class="text-[10px] font-mono text-slate-600" id="active-count">0 MOD</span>
                  </div>
                  <input id="active-search" type="search" data-i18n="active_search" placeholder="Aktifte ara..." class="shelf-search-input" autocomplete="off">
                  <div class="shelf-loading-bar" id="active-loading" style="display:none">
                    <div class="shelf-loading-bar-fill" id="active-loading-bar"></div>
                    <span class="shelf-loading-count" id="active-loading-count">0 / 0 MOD</span>
                  </div>
                </div>
                <div id="ui-active-shelves" class="flex-1 overflow-y-auto">
                  <div class="shelf-skeleton" id="active-skeleton">
                    <div class="app-loading-spinner"></div>
                    <span data-i18n="loading_mods" class="shelf-skeleton-text">MODLAR YÜKLENİYOR</span>
                  </div>
                </div>
              </section>

            </div>
          </div>

        </div> <!-- #ui-main-container sonu -->

        <!-- Splitter: Main <-> Inspector -->
        <div id="main-inspector-splitter" class="w-[4px] bg-slate-700/40 hover:bg-slate-500/50 cursor-ew-resize transition-colors shrink-0 relative mx-[3px]">
          <div class="absolute inset-y-0 -left-[6px] -right-[6px] cursor-ew-resize"></div>
        </div>

        <!-- KATMAN 3: DETAY PANELI (En Sag) -->
        <aside id="ui-inspector" class="w-80 bg-slate-900 border-l border-slate-800 overflow-y-auto p-4 shrink-0 flex flex-col min-w-0" style="max-width: 380px;">
          <div data-i18n="inspector_title" class="text-[10px] font-mono font-bold uppercase tracking-widest text-slate-500 border-b border-slate-800 pb-2 mb-3">Mod Denetimi</div>
          <div id="ui-inspector-content" class="flex-1 flex flex-col justify-between">
            <div class="inspector-loading" id="inspector-loading" style="display:none">
              <div class="app-loading-spinner small"></div>
              <span data-i18n="loading_inspector" class="text-[10px] font-mono uppercase tracking-widest text-slate-500">YÜKLENİYOR</span>
            </div>
            <div data-i18n="inspector_hint" class="text-xs text-slate-500 italic">Detaylarini gormek icin listeden bir moda tiklayin.</div>
          </div>
        </aside>

      </div> <!-- #ui-content-area sonu -->

    </div> <!-- #app-shell sonu -->

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
