<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RimWorld Forge - Ayarlar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="bg-slate-950 text-slate-100 font-sans antialiased overflow-hidden">
    <div id="app-shell" class="flex flex-col h-screen w-screen overflow-hidden">
      
      <!-- Pencere Başlık Çubuğu -->
      <div id="ui-title-bar" class="flex h-8 bg-slate-950 border-b border-slate-900 shrink-0 select-none z-50">
        <div data-tauri-drag-region class="flex-1 flex items-center px-3 cursor-move">
          <span class="pointer-events-none text-[9px] font-mono font-bold tracking-[0.2em] text-rust">RIMWORLD_FORGE // AYARLAR</span>
        </div>
        <div class="flex items-center space-x-1 px-3 shrink-0">
          <button id="btn-window-min" class="p-1 text-slate-600 hover:text-white hover:bg-slate-800 rounded-sm transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 12h14" /></svg>
          </button>
          <button id="btn-window-max" class="p-1 text-slate-600 hover:text-white hover:bg-slate-800 rounded-sm transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4h16v4M4 16v4h16v-4" /></svg>
          </button>
          <button id="btn-window-close" class="p-1 text-slate-600 hover:text-red-500 hover:bg-red-500/20 rounded-sm transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" /></svg>
          </button>
        </div>
      </div>

      <!-- İçerik: Sidebar + Panel -->
      <div id="app-content" class="flex flex-1 overflow-hidden">
        <!-- Sidebar -->
        <aside id="settings-sidebar" class="w-44 bg-slate-900 border-r border-slate-800 flex flex-col py-4 shrink-0">
          <nav class="flex flex-col space-y-1 px-2" id="settings-nav">
            <button data-tab="general" class="settings-tab active flex items-center space-x-2 px-3 py-2 text-xs font-mono text-slate-400 hover:text-slate-100 hover:bg-slate-800 rounded transition-colors">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
              <span>GENEL</span>
            </button>
            <button data-tab="paths" class="settings-tab flex items-center space-x-2 px-3 py-2 text-xs font-mono text-slate-400 hover:text-slate-100 hover:bg-slate-800 rounded transition-colors">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
              <span>YOL</span>
            </button>
            <button data-tab="advanced" class="settings-tab flex items-center space-x-2 px-3 py-2 text-xs font-mono text-slate-400 hover:text-slate-100 hover:bg-slate-800 rounded transition-colors">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9V3m0 0l-3 3m3-3l3 3m-6 9l3 3m0 0l3-3m-3 3V21"/></svg>
              <span>GELİŞMİŞ</span>
            </button>
            <button data-tab="about" class="settings-tab flex items-center space-x-2 px-3 py-2 text-xs font-mono text-slate-400 hover:text-slate-100 hover:bg-slate-800 rounded transition-colors">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
              <span>HAKKINDA</span>
            </button>
          </nav>
        </aside>

        <!-- Panel İçeriği -->
        <main id="settings-panel" class="flex-1 overflow-y-auto p-6 bg-slate-950">
          <!-- Dinamik içerik buraya render edilecek -->
          <div id="settings-content">
            <div class="settings-loading">
              <div class="app-loading-spinner" style="width:32px;height:32px"></div>
              <span class="app-loading-title">YÜKLENİYOR</span>
            </div>
          </div>
        </main>
      </div>

    </div>
    <script type="module" src="/src/windows/settings/main.ts"></script>
  </body>
</html>
